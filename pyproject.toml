[project]
name = "ecgtok"
version = "0.1.0"
description = "Named beat tokens for MIT-BIH classification with Qwen."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "KavehSam" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "wfdb>=4.1",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
train = [
    "torch>=2.2",
    "transformers>=4.46",
    "peft>=0.13",
    "huggingface-hub>=0.26",
    "tqdm>=4.66",
]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecgtok"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
